# From-scratch variant: the policy never sees the hand-tuned constants.
# It starts from a random action (RL.INIT_ACTION, unit space), drawn with
#   rng = np.random.RandomState(2026); u = rng.uniform(0, 1, 4)
# over generic ranges (window influence, penalty k, size lr in [0, 1], search
# scale in [0.5, 2]), rejecting draws within 0.15 of either tracker's tuned
# value in any dimension; the first two accepted draws are start 1 and 2.
# The random start also replaces the constants as the relative reward's shadow
# tracker and the model-selection bar; no deviation cost. The TRACK constants
# below are only used afterwards, by eval_noise.py, as the comparison.
META_ARC: "HiFT_alexnet"

BACKBONE:
    TYPE: "alexnet"

TRACK:
    TYPE: 'HiFTtracker'
    EXEMPLAR_SIZE: 127
    INSTANCE_SIZE: 287
    CONTEXT_AMOUNT: 0.5
    STRIDE: 8
    PENALTY_K: 0.08
    WINDOW_INFLUENCE: 0.42
    LR: 0.30
    w2: 1.0
    w3: 1.0

TRAIN:
    OUTPUT_SIZE: 11
    PRINT_FREQ: 5

RL:
    SNAPSHOT: './snapshot/first.pth'
    DATASET: 'GOT-10k'
    TRAIN_JSON: 'GOT10k_train.json'
    VAL_JSON: 'GOT10k_val.json'
    DATASET_DIR: '../testing_dataset'
    NUM_FOLDS: 2
    VAL_FRACTION: 0.2
    # [window influence, penalty k, size lr, search scale]
    ACTION_LOW: [0.0, 0.0, 0.0, 0.5]
    ACTION_HIGH: [1.0, 1.0, 1.0, 2.0]
    INIT_ACTION: [0.2359, 0.9669, 0.1492, 0.0469]
    NUM_ENVS: 16
    EPISODE_LEN: 300
    ROLLOUT_LEN: 128
    UPDATES: 300
    PPO_EPOCHS: 4
    MINIBATCH: 512
    LR: 0.0003
    GAMMA: 0.95
    GAE_LAMBDA: 0.95
    ENTROPY_COEF: 0.001
    INIT_LOG_STD: -1.0
    HIDDEN: 64
    REWARD: 'relative'
    VAL_EVERY: 25
    DEVIATION_COEF: 0.0
    OBS_MAPS: False
    VAL_DRAWS: 2
    VAL_JITTER: 0.01
    VAL_MARGIN: 0.005
    LOG_DIR: './logs_rl_scratch_hift_s2'
    SNAPSHOT_DIR: './snapshot_rl_scratch_hift_s2'
