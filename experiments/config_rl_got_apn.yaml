# Trained on GOT-10k train (9,335 videos), validated on GOT-10k val (180 videos),
# tested on all of UAV123 with tools/eval_noise.py --test_dataset UAV123.
# Otherwise the same method and settings as config_rl_apn_v2.yaml.
#
# RL post-processing policy on top of the frozen SiamAPN++ model
# (tools/train_reinforce.py), with the same method and settings as
# config_rl_v2.yaml for HiFT so the two trackers are compared like for like.
# Tracker settings are those of SiamAPN++/experiments/config.yaml and
# pysot/core/config_adapn.py in the authors' release; they define the
# baseline the policy starts from and is compared against.
# Weights: general++.pth from the authors' release, copied to
# tools/snapshot/siamapnpp_general.pth.
META_ARC: "SiamAPN++"

TRACK:
    TYPE: 'ADSiamAPNtracker'
    EXEMPLAR_SIZE: 127
    INSTANCE_SIZE: 287
    CONTEXT_AMOUNT: 0.5
    PENALTY_K: 0.079
    WINDOW_INFLUENCE: 0.44
    LR: 0.31
    w1: 1.2
    w2: 1.3
    w3: 1.1

TRAIN:
    OUTPUT_SIZE: 21
    SEARCH_SIZE: 287
    EXEMPLAR_SIZE: 127
    PRINT_FREQ: 5

ANCHOR:
    STRIDE: 8

RL:
    TRACKER: 'SiamAPN++'
    SNAPSHOT: './snapshot/siamapnpp_general.pth'
    DATASET: 'GOT-10k'
    TRAIN_JSON: 'GOT10k_train.json'
    VAL_JSON: 'GOT10k_val.json'
    DATASET_DIR: '../testing_dataset'
    NUM_FOLDS: 2
    VAL_FRACTION: 0.2
    # [window influence, penalty k, size lr, search scale]
    ACTION_LOW: [0.0, 0.0, 0.0, 0.8]
    ACTION_HIGH: [0.9, 0.3, 1.0, 2.0]
    NUM_ENVS: 16
    EPISODE_LEN: 300
    ROLLOUT_LEN: 128
    UPDATES: 300
    PPO_EPOCHS: 4
    MINIBATCH: 512
    LR: 0.0003
    GAMMA: 0.95
    GAE_LAMBDA: 0.95
    ENTROPY_COEF: 0.001
    INIT_LOG_STD: -1.5
    HIDDEN: 64
    REWARD: 'relative'
    VAL_EVERY: 25
    DEVIATION_COEF: 1.0
    OBS_MAPS: False
    VAL_DRAWS: 2
    VAL_JITTER: 0.01
    VAL_MARGIN: 0.005
    LOG_DIR: './logs_rl_got_apn'
    SNAPSHOT_DIR: './snapshot_rl_got_apn'
